var verbMaster={"き":{katsuyo:"せ/○/き/し/しか/○",setsuzoku:"連用形（カ・サ変は特殊）",imi:"過去",yaku:"〜た"},"けり":{katsuyo:"けら/○/けり/ける/けれ/○",setsuzoku:"連用形",imi:"過去、詠嘆",yaku:"〜た、〜たことよ"},"つ":{katsuyo:"て/て/つ/つる/つれ/てよ",setsuzoku:"連用形",imi:"完了、強意、並列",yaku:"〜てしまう、きっと〜"},"ぬ":{katsuyo:"な/に/ぬ/ぬる/ぬれ/ね",setsuzoku:"連用形",imi:"完了、強意、並列",yaku:"〜てしまう、きっと〜"},"たり（完了）":{katsuyo:"たら/たり/たり/たる/たれ/たれ",setsuzoku:"連用形",imi:"完了、存続",yaku:"〜た、〜ている"},"り":{katsuyo:"ら/り/り/る/れ/れ",setsuzoku:"サ未・四已",imi:"完了、存続",yaku:"〜た、〜ている"},"なり（断定）":{katsuyo:"なら/なり・に/なり/なる/なれ/なれ",setsuzoku:"体言・連体形",imi:"断定、存在",yaku:"〜である、〜にある"},"たり（断定）":{katsuyo:"たら/たり・と/たり/たる/たれ/たれ",setsuzoku:"体言",imi:"断定",yaku:"〜である"},"ず":{katsuyo:"ず・ざら/ず・ざり/ず/ぬ・ざる/ね・ざれ/ざれ",setsuzoku:"未然形",imi:"打消",yaku:"〜ない"},"む":{katsuyo:"○/○/む/む/め/○",setsuzoku:"未然形",imi:"推量、意志など",yaku:"〜だろう、〜よう"},"むず":{katsuyo:"○/○/むず/むずる/むずれ/○",setsuzoku:"未然形",imi:"推量、意志など",yaku:"〜だろう、〜よう"},"べし":{katsuyo:"べく・べから/べく・べかり/べし/べき・べかる/べけれ/○",setsuzoku:"終止形",imi:"推量、意志、可能など",yaku:"〜だろう、〜べきだ"},"じ":{katsuyo:"○/○/じ/じ/じ/○",setsuzoku:"未然形",imi:"打消推量・意志",yaku:"〜まい"},"まじ":{katsuyo:"まじく・から/まじく・かり/まじ/まじき・かる/まじけれ/○",setsuzoku:"終止形",imi:"打消推量・意志など",yaku:"〜まい、〜べきでない"},"らむ":{katsuyo:"○/○/らむ/らむ/らめ/○",setsuzoku:"終止形",imi:"現在推量など",yaku:"今ごろ〜ているだろう"},"けむ":{katsuyo:"○/○/けむ/けむ/けめ/○",setsuzoku:"連用形",imi:"過去推量など",yaku:"〜ただろう"},"らし":{katsuyo:"○/○/らし/らし・き/らし/○",setsuzoku:"終止形",imi:"推定",yaku:"〜らしい"},"めり":{katsuyo:"○/めり/めり/める/めれ/○",setsuzoku:"終止形",imi:"推定、婉曲",yaku:"〜ようだ"},"なり（伝聞）":{katsuyo:"○/なり/なり/なる/なれ/○",setsuzoku:"終止形",imi:"伝聞、推定",yaku:"〜そうだ、〜ようだ"},"まし":{katsuyo:"ましか・ませ/○/まし/まし/ましか/○",setsuzoku:"未然形",imi:"反実仮想など",yaku:"もし〜なら…だろうに"},"る":{katsuyo:"れ/れ/る/るる/るれ/れよ",setsuzoku:"四・ナ・ラ未",imi:"自発、可能、受身、尊敬",yaku:"自然と〜れる、等"},"らる":{katsuyo:"られ/られ/らる/らるる/らるれ/られよ",setsuzoku:"四・ナ・ラ以外の未",imi:"自発、可能、受身、尊敬",yaku:"自然と〜れる、等"},"す":{katsuyo:"せ/せ/す/する/すれ/せよ",setsuzoku:"四・ナ・ラ未",imi:"使役、尊敬",yaku:"〜させる、お〜になる"},"さす":{katsuyo:"させ/させ/さす/さする/さすれ/させよ",setsuzoku:"四・ナ・ラ以外の未",imi:"使役、尊敬",yaku:"〜させる、お〜になる"},"しむ":{katsuyo:"しめ/しめ/しむ/しむる/しむれ/しめよ",setsuzoku:"未然形",imi:"使役、尊敬",yaku:"〜させる、お〜になる"},"まほし":{katsuyo:"まほしく・から/まほしく・かり/まほし/まほしき・かる/まほしけれ/○",setsuzoku:"未然形",imi:"願望",yaku:"〜たい"},"たし":{katsuyo:"たく・たから/たく・たかり/たし/たき・たかる/たけれ/○",setsuzoku:"連用形",imi:"願望",yaku:"〜たい"},"ごとし":{katsuyo:"ごとく/ごとく/ごとし/ごとき/○/○",setsuzoku:"連体・助詞・体言",imi:"比況、例示",yaku:"〜のようだ"},"ごとくなり":{katsuyo:"ごとくなら/ごとくなり・に/ごとくなり/ごとくなる/ごとくなれ/ごとくなれ",setsuzoku:"連体・助詞・体言",imi:"比況、例示",yaku:"〜のようだ"}};

var stages=[
  {name:"天智天皇",img:sampleImgs[0],needsExtraZoom:true,poem:"秋の田の かりほの庵の 苫をあらみ<br>わが衣手は 露にぬれつつ",trans:"秋の田のほとりにある仮小屋の屋根をふく草の編み目が粗いので、私の袖は夜露に濡れ続けていることだ。",bio:"第38代天皇。中大兄皇子として大化の改新を行い、のちに即位した。日本の律令国家の基礎を築いた。"},
  {name:"柿本人麻呂",img:sampleImgs[1],needsExtraZoom:false,poem:"あしびきの 山鳥の尾の しだり尾の<br>ながながし夜を ひとりかも寝む",trans:"山鳥の長く垂れ下がった尾のように、長く長く退屈な秋の夜を、私は一人さびしく寝るのだろうか。",bio:"飛鳥時代の代表的歌人。「歌聖」と呼ばれ、『万葉集』を代表する宮廷歌人として天皇の事績などを詠んだ。"},
  {name:"小野小町",img:sampleImgs[2],needsExtraZoom:false,poem:"花の色は うつりにけりな いたづらに<br>わが身世にふる ながめせしまに",trans:"桜の花の色はすっかり色あせてしまったことだ。むなしく春の長雨が降っていた間に。私の容姿もすっかり衰えてしまった、物思いにふけっている間に。",bio:"絶世の美女と伝わる平安前期の女流歌人。六歌仙の一人。情熱的な恋の歌や、老いを嘆く歌を多く残した。"},
  {name:"在原業平",img:sampleImgs[3],needsExtraZoom:true,poem:"ちはやぶる 神代もきかず 竜田川<br>からくれなゐに 水くくるとは",trans:"さまざまな不思議なことが起こっていた神代の昔でさえも聞いたことがない。この竜田川に一面にもみじが散り浮いて、流れる水を鮮やかな紅色にくくり染めにしているなどとは。",bio:"六歌仙の一人。美男で恋多き貴公子として知られ、『伊勢物語』の主人公のモデルとされる。"},
  {name:"菅原道真",img:sampleImgs[4],needsExtraZoom:false,poem:"このたびは 幣もとりあへず 手向山<br>紅葉の錦 神のまにまに",trans:"今回の旅は急なことで、お供えする幣（ぬさ）も用意することができませんでした。代わりにこの手向山の錦のような美しい紅葉を、神の御心のままにお納めください。",bio:"平安時代の学者・政治家。右大臣まで昇ったが、藤原氏の陰謀により太宰府に左遷された。死後は学問の神様（天神様）として祀られる。"},
  {name:"紀貫之",img:sampleImgs[5],needsExtraZoom:true,poem:"人はいさ 心も知らず ふるさとは<br>花ぞ昔の 香ににほひける",trans:"人の心はさあどうだか、私にはわかりません。でも昔なじみのこの村では、梅の花だけが昔と変わらない良い香りを放って咲いていることですよ。",bio:"『古今和歌集』の撰者の一人で、仮名による序文（仮名序）を執筆。また、女性に仮託して『土佐日記』を書いた三十六歌仙の一人。"},
  {name:"和泉式部",img:sampleImgs[6],freedImg:sampleImgs[6],needsExtraZoom:false,poem:"あらざらむ この世のほかの 思ひ出に<br>いまひとたびの 逢ふこともがな",trans:"私はもうすぐ死んでしまうでしょう。せめてあの世への思い出に、もう一度だけあなたにお逢いしたいものです。",bio:"情熱的な恋の歌で知られる平安中期の女流歌人。恋多き人生を送り、その才能は紫式部からも賞賛と嫉妬を受けた。多くの秀歌を残している。"},
  {name:"紫式部",img:sampleImgs[7],needsExtraZoom:false,poem:"めぐりあひて 見しやそれとも わかぬ間に<br>雲がくれにし 夜半の月かな",trans:"せっかく久しぶりにめぐり逢えたのに、惹きとめることもできない間に、あわただしく帰ってしまわれた。まるで、雲間に隠れてしまった夜半の月のように。",bio:"世界最古の長編小説『源氏物語』の作者。藤原道長の娘・中宮彰子に女房として仕え、宮中の様子を『紫式部日記』にも記した。"},
  {name:"清少納言",img:sampleImgs[8],needsExtraZoom:false,poem:"夜をこめて 鳥のそらねは はかるとも<br>よに逢坂の 関はゆるさじ",trans:"まだ夜深いうちに、鶏の鳴き真似をして騙そうとしても、この逢坂の関だけは決して許しませんよ。（私を騙して逢瀬を遂げようとしても、決して騙されませんよ）",bio:"『枕草子』の作者。藤原定子の女房として活躍し、漢学の深い教養と機知に富んだ受け答えで名を馳せた。"},
  {name:"西行法師",img:sampleImgs[9],needsExtraZoom:true,poem:"なげけとて 月やはものを 思はする<br>かこち顔なる わが涙かな",trans:"嘆けと言って、月が私に物思いをさせるのだろうか。いや、そうではないのに、月のせいだとばかりにこぼれ落ちる私の涙であるよ。",bio:"平安末期から鎌倉初期の僧侶・歌人。元は北面武士だったが出家して諸国を行脚し、自然や月、桜を愛する歌を『山家集』に多く残した。"},
  {name:"寂蓮法師",img:sampleImgs[10],needsExtraZoom:false,poem:"むらさめの 露もまだひぬ まきの葉に<br>霧たちのぼる 秋の夕ぐれ",trans:"にわか雨が通り過ぎて、真木（杉や檜など）の葉に降りかかったその露もまだ乾いていないというのに、もうそこから霧が白く立ちのぼっている秋の夕暮れであるよ。",bio:"新古今時代の代表的歌人。藤原俊成の甥。出家して諸国を行脚し、幽玄で絵画的な美しい情景を詠んだ。"},
  {name:"藤原定家",img:sampleImgs[11],needsExtraZoom:true,poem:"来ぬ人を まつほの浦の 夕なぎに<br>焼くや藻塩の 身もこがれつつ",trans:"松帆の浦の夕なぎの時に焼く藻塩のように、いつまで待っても来ない人を待ち焦がれて、私の身も恋い焦がれていることです。",bio:"『新古今和歌集』や『百人一首』の撰者。新古今調と呼ばれる、技巧的で妖艶な美しさを追求した和歌の第一人者。"},
  {name:"後鳥羽院",img:sampleImgs[12],needsExtraZoom:true,poem:"人もをし 人も恨めし あぢきなく<br>世を思ふゆゑに もの思ふ身は",trans:"ある時は人が愛おしく思われ、またある時は人が恨めしく思われる。つまらない世の中だと思うため、あれこれと物思いに沈む私であるよ。",bio:"第82代天皇。多芸多才で『新古今和歌集』の編纂を命じ、のちに即位した。鎌倉幕府倒幕のため承久の乱を起こしたが敗れ、隠岐島に流された。"}
];

var fullQuizDatabase=[
  {cat:"kako",q:"過去の助動詞「き」は活用語の何形に接続するか。",choices:["未然形","連用形","終止形","連体形"],ans:1,v:"き",exp:"過去の助動詞「き」は原則として連用形に接続します（カ変・サ変には未然形にも接続）。"},
  {cat:"kako",q:"助動詞「けり」は活用語の何形に接続するか。",choices:["未然形","終止形","連用形","連体形"],ans:2,v:"けり",exp:"過去・詠嘆の助動詞「けり」は活用語の連用形に接続します。"},
  {cat:"kako",q:"過去の助動詞「き」の未然形を答えよ。",choices:["せ","し","しか","き"],ans:0,v:"き",exp:"「き」の活用は「せ／○／き／し／しか／○」となります。"},
  {cat:"kako",q:"助動詞「き」の已然形を答えよ。",choices:["し","せ","しか","き"],ans:2,v:"き",exp:"「き」の已然形は「しか」です。"},
  {cat:"kako",q:"「き」と「けり」のうち、直接体験したことを回想するのはどちらか。",choices:["き","けり","つ","ぬ"],ans:0,v:"き",exp:"「き」は話し手が直接体験した過去を表します。"},
  {cat:"kako",q:"「富士の高嶺に雪は降り<span class='highlight-word'>ける</span>」の「ける」の意味は何か。",choices:["過去","詠嘆","完了","存続"],ans:1,v:"けり",exp:"『富士の高嶺に雪が降り積もっていることよ。』和歌の末尾などで感動を表す「けり」は「詠嘆（〜だったのだなあ）」を表します。"},
  {cat:"kako",q:"「けり」の詠嘆の用法は、どのような文で使われることが多いか。",choices:["漢文訓読体","物語の地の文","和歌や会話文","軍記物語"],ans:2,v:"けり",exp:"詠嘆の「けり」は和歌や会話文中でよく用いられます。"},
  {cat:"kako",q:"助動詞「き」がサ変動詞の未然形「せ」に接続する場合、何という形になるか。",choices:["せけり","せし（せしか）","せき","しき"],ans:1,v:"き",exp:"サ変＋「き」は未然形「せ」に接続して「せし」「せしか」の形をとります。"},
  {cat:"kako",q:"「今は昔、竹取の翁といふものありけり。」の現代語訳を答えよ。",choices:["昔、竹取の翁という者がいた。","今は昔だが、翁がいた。","昔、竹取の翁がいたことだなあ。","竹取の翁という者がいるそうだ。"],ans:0,v:"けり",exp:"「ありけり」は伝聞過去（〜がいたそうだ／〜がいた）と訳します。"},
  {cat:"kako",q:"「京より下りしときに、みな人、子どもなかりき。」の現代語訳を答えよ。",choices:["京から下ったとき、誰もいなかった。","京から下ったとき、みな子供がなかった。","京から下ったとき、子供が泣いていた。","京から下ったとき、子供がいなくなった。"],ans:1,v:"き",exp:"「なかりき」は「無かり＋き」で「〜が無かった」という意味になります。"},
  {cat:"kako",q:"「この殿たちの御仲いと悪しかり<span class='highlight-word'>き</span>。」の「き」の意味は何か。",choices:["過去","完了","存続","詠嘆"],ans:0,v:"き",exp:"『この殿たちの仲はたいそう悪かった。』「き」は自分の直接体験した過去を表す助動詞です。"},
  {cat:"kako",q:"「我見<span class='highlight-word'>し</span>人もなき世なり。」の「し」の意味は何か。",choices:["過去","断定","打消","意志"],ans:0,v:"き",exp:"『私が知っていた人もいない世の中である。』「し」は助動詞「き」の連体形です。"},
  {cat:"kako",q:"「雨のいたく降り<span class='highlight-word'>しか</span>ば、え参らず。」の「しか」の意味は何か。",choices:["過去","完了","推量","条件"],ans:0,v:"き",exp:"『雨がひどく降ったので、参上することができなかった。』「しか」は助動詞「き」の已然形です。"},
  {cat:"kako",q:"「むかし、男あり<span class='highlight-word'>けり</span>。」の「けり」の意味は何か。",choices:["過去","詠嘆","伝聞","推量"],ans:0,v:"けり",exp:"『昔、男がいたそうだ。』「けり」は他者から聞いた過去（〜たそうだ）を表します。"},
  {cat:"kako",q:"「花の色は うつりに<span class='highlight-word'>けり</span>な」の「けり」の意味は何か。",choices:["詠嘆","過去","断定","完了"],ans:0,v:"けり",exp:"『花の色は色あせてしまったのだなあ。』和歌や会話文中の「けり」は気づきの「詠嘆（〜だったのだなあ）」を表します。"},
  {cat:"kako",q:"「大門、金堂など近くまであり<span class='highlight-word'>しか</span>ど」の「しか」の意味は何か。",choices:["過去","完了","強意","詠嘆"],ans:0,v:"き",exp:"『大門や金堂などは、最近まであったが、』「ありしかど」の「しか」は過去の助動詞「き」の已然形です。"},
  {cat:"kako",q:"「ある時には、来<span class='highlight-word'>し</span>方行く末も知らず」の「し」の意味は何か。",choices:["過去","打消","受身","推量"],ans:0,v:"き",exp:"『来た方角も進む先もわからなくなり、』カ変「来」の未然形に接続した過去の助動詞「き」の連体形「し」です。"},
  {cat:"kako",q:"「わがせ<span class='highlight-word'>し</span>がごとうるはしみせよ」の「し」の意味は何か。",choices:["過去","完了","存続","断定"],ans:0,v:"き",exp:"『私がおまえを愛したように、おまえも相手を愛して仲良く暮らしなさいよ。』サ変「す」の未然形「せ」に過去の助動詞「き」の連体形「し」が接続した形です。"},
  {cat:"kako",q:"「祭り見<span class='highlight-word'>し</span>さま、いとめづらかなりき。」の「し」の意味は何か。",choices:["過去","完了","打消","尊敬"],ans:0,v:"き",exp:"『（賀茂祭りを）見物した様子は、たいそう珍妙であった。』動詞の連用形「見」に接続する「し」は過去の助動詞「き」の連体形です。"},
  {cat:"kako",q:"「思ふさまに吹き<span class='highlight-word'>ける</span>、世にたぐひなく」の「ける」の意味は何か。",choices:["過去","詠嘆","推量","完了"],ans:0,v:"けり",exp:"『思う存分に吹いた（笛の音色は）、世に並ぶものがなく』地の文で過去の動作・状態を表す「けり」の連体形「ける」です。"},

  {cat:"shieki",q:"「主、人々を呼びて、格子を上げ<span class='highlight-word'>さす</span>。」の「さす」の意味は何か。",choices:["使役","尊敬","受身","可能"],ans:0,v:"さす",exp:"他者に動作を行わせる「使役（〜させる）」を表します。『主人が人々を呼んで格子を上げさせる。』"},
  {cat:"shieki",q:"「声高にものも言は<span class='highlight-word'>せ</span>ず。」の「せ」の意味は何か。",choices:["使役","尊敬","受身","過去"],ans:0,v:"す",exp:"尊敬語を伴わない場合はすべて使役です。"},
  {cat:"shieki",q:"「秋田を呼びてつけ<span class='highlight-word'>さす</span>。」の「さす」の意味は何か。",choices:["使役","尊敬","可能","自発"],ans:0,v:"さす",exp:"ア段音以外（「つけ」）の未然形に接続する使役の助動詞です。『秋田を呼んで（名前を）つけさせる。』"},
  {cat:"shieki",q:"「君はあの松原へ入ら<span class='highlight-word'>せ</span>給へ。」の「せ」の意味は何か。",choices:["尊敬","使役","受身","過去"],ans:0,v:"す",exp:"「せ＋給ふ（尊敬の補助動詞）」の組み合わせです。"},
  {cat:"ganbo",q:"「まほし」は何形に接続するか。",choices:["未然形","連用形","終止形","連体形"],ans:0,v:"まほし",exp:"「まほし」は未然形に接続します。"},
  {cat:"ganbo",q:"「たし」は何形に接続するか。",choices:["未然形","連用形","終止形","連体形"],ans:1,v:"たし",exp:"「たし」は連用形に接続します。"},
  {cat:"ganbo",q:"「名残りを、ひとめなりとも見<span class='highlight-word'>まほし</span>」の「まほし」の意味は何か。",choices:["願望","推量","意志","比況"],ans:0,v:"まほし",exp:"未然形に接続し、自己の「願望（〜したい）」を表します。『名残を、一目だけでも見たい』"},
  {cat:"ganbo",q:"「我が手から、生首をも見<span class='highlight-word'>たし</span>」の「たし」の意味は何か。",choices:["願望","完了","過去","推定"],ans:0,v:"たし",exp:"連用形に接続し、自己の「願望（〜したい）」を表します。『私の手で、生首を見たい』"},
  {cat:"ganbo",q:"「続きの見<span class='highlight-word'>まほしく</span>おぼゆれど」の「まほしく」の意味は何か。",choices:["願望","意志","推量","推定"],ans:0,v:"まほし",exp:"「見＋まほしく」で「見たい」という自己の願望を表す連用形です。『続きが見たく思われるが、』"},
  {cat:"ganbo",q:"「御主へ返し<span class='highlight-word'>たし</span>。」の「たし」の意味は何か。",choices:["願望","推量","意志","完了"],ans:0,v:"たし",exp:"連用形「返し」に接続し「返したい」という願望を表します。『持ち主へ（小判を）返したい。』"},

  {cat:"hikyo",q:"「つひに本意の<span class='highlight-word'>ごとく</span>あひにけり。」の「ごとく」の意味は何か。",choices:["比況","例示","推定","断定"],ans:0,v:"ごとし",exp:"格助詞「の」に接続し「〜のように」と例える比況の連用形です。『とうとうはじめの望みのように結婚した。』"},
  {cat:"hikyo",q:"「往生要集<span class='highlight-word'>ごときの</span>抄物を入れたり。」の「ごときの」の意味は何か。",choices:["例示","比況","推定","断定"],ans:0,v:"ごとし",exp:"同類のものを例として挙げる「例示（〜のような）」の連体形です。『往生要集などの書物の抜き書きを入れている。』"}
];

var currentStage=1,trapCount=5,currentTrapId=null,stageQuestions=[],recentQuestionIndices=[];

window.showCustomAlert = function(msg, opts) {
  var m=document.getElementById('custom-alert-modal'), me=document.getElementById('custom-alert-msg'), be=document.getElementById('custom-alert-btns');
  if(!m || !me || !be) { if(opts && opts.confirm){ if(confirm(msg)) opts.onYes(); }else{ alert(msg); } return; }
  me.innerText = msg; be.innerHTML = "";
  if(opts && opts.confirm) {
    var bY=document.createElement('button'); bY.className='btn-small'; bY.innerText='はい';
    bY.onclick=function(){ m.style.display='none'; if(opts.onYes) opts.onYes(); };
    var bN=document.createElement('button'); bN.className='btn-small btn-reset'; bN.innerText='いいえ';
    bN.onclick=function(){ m.style.display='none'; };
    be.appendChild(bY); be.appendChild(bN);
  } else {
    var bO=document.createElement('button'); bO.className='btn-small'; bO.innerText='OK';
    bO.onclick=function(){ m.style.display='none'; }; be.appendChild(bO);
  }
  m.style.display='flex';
};

window.formatVerticalText = function(t) {
  if(!t) return "";
  var sv = '<svg width="1em" height="1em" viewBox="0 0 100 100" style="display:inline-block; vertical-align:middle; margin:0; writing-mode: horizontal-tb;"><line x1="15" y1="85" x2="85" y2="15" stroke="currentColor" stroke-width="4"/></svg>';
  return t.replace(/[\/／]/g, sv);
};

window.toggleCheckboxes = function(c) {
  var cb = document.querySelectorAll('#verb-checkboxes input[type="checkbox"]');
  for(var i=0; i<cb.length; i++) cb[i].checked=c;
};

function initFloatingBg() {
  var c=document.getElementById('bg-chars-container'); if(!c) return; c.innerHTML="";
  var cw=100/3, ch=100/3, ix=[];
  for(var i=0; i<9; i++) ix.push(i);
  for(var j=8; j>0; j--){ var r=Math.floor(Math.random()*(j+1)), t=ix[j]; ix[j]=ix[r]; ix[r]=t; }
  for(var k=0; k<9; k++) {
    var d=document.createElement('div'); d.className='floating-char-wrap';
    d.style.left = Math.max(1, Math.min(((ix[k]%3)*cw)+(Math.random()*15), 75))+"%";
    d.style.top = Math.max(1, Math.min((Math.floor(ix[k]/3)*ch)+(Math.random()*15), 75))+"%";
    d.style.animationDelay = (Math.random()*5)+"s"; d.style.animationDuration = (8+Math.random()*8)+"s";
    var img=document.createElement('img'); img.src=sampleImgs[ix[k]%sampleImgs.length];
    d.appendChild(img); c.appendChild(d);
  }
}

window.startGame = function(isCont) {
  var n=1;
  if(isCont) {
    try { var s=localStorage.getItem('cleared_stages_v4'); if(s) { var a=JSON.parse(s); if(Array.isArray(a)&&a.length>0) n=Math.max.apply(null,a)+1; } } catch(e){ localStorage.removeItem('cleared_stages_v4'); }
  }
  currentStage = n>13 ? 13 : n; window.setupStage();
};

window.resetGame = function() {
  window.showCustomAlert("進捗をリセットしますか？", {
    confirm: true,
    onYes: function() {
      try { localStorage.removeItem('cleared_stages_v4'); } catch(e) {}
      currentStage=1; recentQuestionIndices=[]; window.switchScreen('top-screen');
    }
  });
};

window.switchScreen = function(id) {
  var s=document.querySelectorAll('.screen'); for(var i=0; i<s.length; i++) s[i].classList.remove('active');
  var t=document.getElementById(id); if(t) t.classList.add('active');
};

function getFilteredQuestions() {
  var c=document.querySelectorAll('#verb-checkboxes input:checked'), a=[];
  for(var i=0; i<c.length; i++) a.push(c[i].value);
  var f=[]; if(a.length>0) f=fullQuizDatabase.filter(function(q){ return a.indexOf(q.cat)!==-1; });
  if(f.length===0) f=[].concat(fullQuizDatabase);
  return f;
}

window.setupStage = function() {
  try {
    trapCount=5; var d=stages[currentStage-1]; stageQuestions=getFilteredQuestions();
    if(!stageQuestions || stageQuestions.length===0) stageQuestions=fullQuizDatabase;
    var st=document.getElementById('stage-title'); if(st) st.innerText="ステージ "+currentStage+" : "+d.name;
    var ri=document.getElementById('charafreed-info'); if(ri) ri.style.display='none';
    var it=document.getElementById('stage-instruction-text'); if(it) it.style.display='block';
    var tb=document.getElementById('btn-top-back'); if(tb) tb.style.display='inline-block';
    var ci=document.getElementById('char-img');
    if(ci) { ci.className='character-img'; ci.src=d.img; if(d.name==="和泉式部") ci.className='character-img custom-full-img'; }
    var pm=["p1","p2","p3","p4","p5","p6","p7","p8","p9","p10","p11","p12","p13"], pid=pm[(currentStage-1)%pm.length];
    for(var i=1; i<=5; i++) {
      var gp=document.getElementById("trap-"+i), pp=document.getElementById("svg-path-"+i);
      if(gp && pp) {
        gp.classList.remove('trap-part-hidden'); pp.setAttribute('fill', 'url(#'+pid+')');
        gp.onclick=null; pp.onclick=null;
        var bC = (function(id){ return function(e){ e.preventDefault(); e.stopPropagation(); window.openQuiz(id); }; })(i);
        gp.onclick=bC; pp.onclick=bC;
      }
    }
  } catch(e) { alert("エラー:"+e.message); } finally { window.switchScreen('game-screen'); }
};

window.openQuiz = function(tId) {
  try {
    currentTrapId=tId;
    if(!stageQuestions||stageQuestions.length===0) stageQuestions=getFilteredQuestions();
    if(!stageQuestions||stageQuestions.length===0) { alert("問題データがありません。"); return; }
    var ps=stageQuestions.length, mh=ps>30 ? 30 : Math.max(1,ps-2), av=[];
    for(var i=0; i<ps; i++) if(recentQuestionIndices.indexOf(i)===-1) av.push(i);
    if(av.length===0) { av=[]; for(var j=0; j<ps; j++) av.push(j); }
    var sq=av[Math.floor(Math.random()*av.length)];
    recentQuestionIndices.push(sq); if(recentQuestionIndices.length>mh) recentQuestionIndices.shift();
    var qz=stageQuestions[sq], qm=document.getElementById('quiz-modal');
    if(qm) { qm.dataset.qIndex=sq; qm.scrollTop=0; }
    var qq=document.getElementById('quiz-question'); if(qq&&qz) qq.innerHTML=qz.q;
    var qc=document.getElementById('quiz-choices');
    if(qc&&qz) {
      qc.innerHTML=""; var co=qz.choices.map(function(t,x){ return {t:t, ox:x}; });
      for(var k=co.length-1; k>0; k--){ var r=Math.floor(Math.random()*(k+1)), tp=co[k]; co[k]=co[r]; co[r]=tp; }
      co.forEach(function(o){
        var b=document.createElement("button"); b.type="button"; b.innerText=o.t;
        b.onclick=function(){ window.checkAnswer(o.ox, qz.ans); }; qc.appendChild(b);
      });
    }
    var qf=document.getElementById('quiz-feedback'); if(qf) { qf.style.display='none'; qf.className=""; }
    var qv=document.getElementById('quiz-verb-info'); if(qv) { qv.style.display='none'; qv.scrollTop=0; qv.scrollLeft=0; }
    var nq=document.getElementById('btn-next-quiz'); if(nq) nq.style.display='none';
    var cq=document.getElementById('btn-close-quiz'); if(cq) cq.style.display='none';
    if(qm) qm.style.display='flex';
  } catch(err) { alert("エラー:"+err.message); }
};

window.checkAnswer = function(sel, cor) {
  var bs=document.querySelectorAll('#quiz-choices button'); for(var i=0; i<bs.length; i++) bs[i].disabled=true;
  var qi=parseInt(document.getElementById('quiz-modal').dataset.qIndex, 10), qz=stageQuestions[qi], vd=verbMaster[qz.v];
  bs.forEach(function(b){ if(b.innerText===qz.choices[cor]) b.classList.add('correct-btn'); });

  if(vd) {
    var vn=qz.v, fvn=window.formatVerticalText(vn), fimi=window.formatVerticalText(vd.imi), fset=window.formatVerticalText(vd.setsuzoku), fyk=window.formatVerticalText(vd.yaku);
    var re=qz.exp, tm=re.match(/『([^』]+)』/), tt="", et=re;
    if(tm) { tt=tm[1]; et=re.replace(/『[^』]+』/,'').trim(); }
    var ec=document.getElementById('quiz-explanation-container');
    if(ec) {
      ec.innerHTML=""; var pe=document.createElement('p'); pe.className='exp-para-block'; pe.innerHTML="【解説】 "+window.formatVerticalText(et); ec.appendChild(pe);
      if(tt) { var pt=document.createElement('p'); pt.className='exp-para-block'; pt.innerHTML="【現代語訳】 "+window.formatVerticalText(tt); ec.appendChild(pt); }
    }
    var fk=window.formatVerticalText(vd.katsuyo.replace(/\s+/g,''));
    if(fvn==="ごとくなり") fvn="ごとく<br>なり"; if(fvn.indexOf("（")!==-1) fvn=fvn.replace("（","<br><span style='white-space:nowrap'>（").replace("）","）</span>");
    document.getElementById('verb-name').innerHTML=fvn; document.getElementById('verb-imi').innerHTML=fimi;
    document.getElementById('verb-setsuzoku').innerHTML=fset; document.getElementById('verb-katsuyo').innerHTML=fk; document.getElementById('verb-yaku').innerHTML=fyk;
    var ib=document.getElementById('quiz-verb-info'); if(ib) ib.style.display='block';
    setTimeout(function(){ var mb=document.getElementById('quiz-modal'); if(mb) mb.scrollTop=0; if(ib){ib.scrollLeft=0; ib.scrollTop=0;} }, 50);
  }
  
  var fb=document.getElementById('quiz-feedback');
  if(fb) {
    fb.style.display='block'; fb.className=""; void fb.offsetWidth; fb.className="feedback-pop";
    if(parseInt(sel,10)===parseInt(cor,10)) {
      fb.style.color="#1e90ff"; fb.innerText="大正解！！"; var nq=document.getElementById('btn-next-quiz'); if(nq) nq.style.display='block';
    } else {
      fb.style.color="#ff1493"; fb.innerText="ザンネン..."; var cq=document.getElementById('btn-close-quiz'); if(cq) cq.style.display='block';
    }
  }
};

window.nextQuiz = function() {
  var qm=document.getElementById('quiz-modal'); if(qm){ qm.style.display='none'; qm.scrollTop=0; }
  var ib=document.getElementById('quiz-verb-info'); if(ib){ ib.scrollTop=0; ib.scrollLeft=0; }
  var tp=document.getElementById("trap-"+currentTrapId); if(tp) tp.classList.add('trap-part-hidden');
  trapCount--; checkClear();
};

window.closeQuiz = function() {
  var qm=document.getElementById('quiz-modal'); if(qm){ qm.style.display='none'; qm.scrollTop=0; }
  var ib=document.getElementById('quiz-verb-info'); if(ib){ ib.scrollTop=0; ib.scrollLeft=0; }
};

function checkClear() {
  if(trapCount===0) {
    var ci=document.getElementById('char-img'), cd=stages[currentStage-1];
    if(ci) { if(cd.freedImg) ci.src=cd.freedImg; ci.classList.add('freed'); }
    document.getElementById('freed-name').innerText=cd.name; document.getElementById('freed-poem').innerHTML=cd.poem;
    document.getElementById('freed-trans').innerHTML=cd.trans; document.getElementById('freed-bio').innerText=cd.bio;
    var isA=false;
    try {
      var sv=localStorage.getItem('cleared_stages_v4'), ls=[];
      if(sv){ var ps=JSON.parse(sv); if(Array.isArray(ps)) ls=ps; }
      if(ls.indexOf(currentStage)===-1) { ls.push(currentStage); localStorage.setItem('cleared_stages_v4', JSON.stringify(ls)); }
      if(ls.length>=13) isA=true;
    } catch(e) { localStorage.removeItem('cleared_stages_v4'); }
    
    setTimeout(function() {
      if(isA) { window.showEnding(); return; }
      var it=document.getElementById('stage-instruction-text'); if(it) it.style.display='none';
      var tb=document.getElementById('btn-top-back'); if(tb) tb.style.display='none';
      var ri=document.getElementById('charafreed-info'); if(ri) ri.style.display='block';
    }, 1000);
  }
}

window.clickCharacter = function(ix) { window.showCharacterDetail(ix); };
window.clickStage = function(sn) { currentStage=sn; window.setupStage(); };

window.openPictureBook = function(fg) {
  var sv=document.querySelectorAll('#verb-checkboxes input:checked');
  if(sv.length===0) { window.showCustomAlert("助動詞を選択してください"); return; }
  var cl=[];
  try { var s=localStorage.getItem('cleared_stages_v4'); if(s) { var p=JSON.parse(s); if(Array.isArray(p)) cl=p; } } catch(e) { localStorage.removeItem('cleared_stages_v4'); }
  if(cl.length>=13) { window.showEnding(); return; }
  
  var ge=document.getElementById('book-guide-text');
  if(ge) { if(cl.length===0) ge.innerText="※「？」をタップすると問題に進みます。"; else ge.innerText="※「？」をタップすると問題に進みます。イラストをタップすると詳細解説が見られます。"; }
  
  var gd=document.getElementById('silhouette-grid');
  if(gd) {
    gd.innerHTML="";
    for(var i=1; i<=13; i++) {
      var d=document.createElement('div'); d.className='sil-char';
      if(cl.indexOf(i)!==-1) {
        d.classList.add('cleared'); d.setAttribute('onclick', 'window.clickCharacter('+(i-1)+')');
        var zC=stages[i-1].needsExtraZoom?"img-extra-zoom":"", cC=stages[i-1].name==="和泉式部"?"custom-thumb":"";
        d.innerHTML='<img src="'+(stages[i-1].freedImg||stages[i-1].img)+'" class="'+(zC+" "+cC).trim()+'">';
      } else { d.innerText="?"; d.setAttribute('onclick', 'window.clickStage('+i+')'); }
      gd.appendChild(d);
    }
  }
  window.switchScreen('progress-screen');
};

window.showCharacterDetail = function(ix) {
  var cd=stages[ix]; document.getElementById('detail-name').innerText=cd.name; document.getElementById('detail-poem').innerHTML=cd.poem;
  document.getElementById('detail-trans').innerHTML=cd.trans; document.getElementById('detail-bio').innerText=cd.bio;
  var di=document.getElementById('detail-img');
  if(di) { di.src=cd.freedImg||cd.img; di.className=""; if(cd.name==="和泉式部") di.classList.add("custom-thumb"); else if(cd.needsExtraZoom) di.classList.add("img-extra-zoom"); }
  window.switchScreen('character-detail-screen');
};

window.handleDetailBack = function() {
  var cl=[]; try{ var s=localStorage.getItem('cleared_stages_v4'); if(s){ var p=JSON.parse(s); if(Array.isArray(p)) cl=p; } }catch(e){}
  if(cl.length>=13) window.showEnding(); else window.openPictureBook(false);
};

function createConfetti() {
  var bx=document.getElementById('confetti-box'); if(!bx) return; bx.innerHTML="";
  var cs=['#f44336','#e91e63','#9c27b0','#673ab7','#3f51b5','#2196f3','#03a9f4','#00bcd4','#009688','#4caf50','#8bc34a','#cddc39','#ffeb3b','#ffc107','#ff9800','#ff5722'];
  for(var i=0; i<60; i++) {
    var p=document.createElement('div'); p.className='confetti'; p.style.left=Math.random()*100+'%';
    p.style.backgroundColor=cs[Math.floor(Math.random()*cs.length)];
    p.style.animationDuration=(2.5+Math.random()*3)+'s'; p.style.animationDelay=(Math.random()*2)+'s'; bx.appendChild(p);
  }
}

window.showEnding = function() {
  createConfetti(); var stg=document.getElementById('dance-stage');
  if(stg) {
    stg.innerHTML="";
    stages.forEach(function(cD, i) {
      var dn=document.createElement('div'); dn.className='dancer'; dn.setAttribute('onclick', 'window.clickCharacter('+i+')');
      var zC=cD.needsExtraZoom?"img-extra-zoom":"", cC=cD.name==="和泉式部"?"custom-thumb":"";
      dn.innerHTML='<img src="'+(cD.freedImg||cD.img)+'" class="'+(zC+" "+cC).trim()+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">';
      dn.style.animationDelay=((i%3)*0.2)+"s"; stg.appendChild(dn);
    });
  }
  window.switchScreen('ending-screen');
};

if(document.readyState==='complete'||document.readyState==='interactive'){initFloatingBg();}else{document.addEventListener('DOMContentLoaded',initFloatingBg);}
</script>
